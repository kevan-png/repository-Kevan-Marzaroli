/* Halo */
const gt=(()=>{const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');
  const r=g.createRadialGradient(64,64,0,64,64,64);
  r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(.3,'rgba(255,255,255,.35)');r.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=r;g.fillRect(0,0,128,128);return new THREE.CanvasTexture(c)})();
const halo=(w)=>new THREE.MeshBasicMaterial({map:gt,color:OR,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,opacity:w});

/* Constantes de l’arc */
const R=4.5,N=16,D=.2,T0=-2.6,ST=1.6,DT=.26;
const P=th=>new V(R*Math.cos(th),0,R*Math.sin(th));
const dark=new THREE.MeshStandardMaterial({color:0x151518,metalness:.7,roughness:.35});
const edgeMat=new THREE.LineBasicMaterial({color:OR,transparent:true,opacity:.7});
const box=(w,h,d,x,y,z,edge)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),dark);m.position.set(x,y,z);
  if(edge)m.add(new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry),edgeMat));return m};

/* Dominos */
const bodyGeo=new THREE.BoxGeometry(.18,1.5,.55),grey=new THREE.Color(0x4a4a50),orange=new THREE.Color(OR);
const doms=[];
for(let i=0;i<N;i++){
  const th=T0+i*D,g=new THREE.Group();
  const mat=new THREE.MeshStandardMaterial({color:0x1d1d21,metalness:.6,roughness:.3,emissive:OR,emissiveIntensity:0});
  const m=new THREE.Mesh(bodyGeo,mat);m.position.set(-.09,.75,0);
  const em=new THREE.LineBasicMaterial({color:0x4a4a50,transparent:true,opacity:.4});
  const e=new THREE.LineSegments(new THREE.EdgesGeometry(bodyGeo),em);e.position.copy(m.position);
  g.add(m,e);g.position.copy(P(th));g.rotation.y=Math.atan2(-Math.cos(th),-Math.sin(th));
  add(g,true);doms.push({g,mat,em});
}

/* Pointillés lumineux le long de l’arc */
const dots=[];
for(let i=0;i<48;i++){
  const f=-1+i*(N+1)/48,mt=new THREE.MeshBasicMaterial({color:0x2a2a30});
  const m=new THREE.Mesh(new THREE.SphereGeometry(.06,8,6),mt);
  m.position.copy(P(T0+f*D)).multiplyScalar(1.22).setY(.06);add(m,false);dots.push({mt,f});
}

/* Baie de serveurs au départ */
const rack=new THREE.Group(),leds=[];
for(let k=0;k<4;k++){
  const y=.3+k*.58;rack.add(box(1.5,.5,1,0,y,0,true));
  for(let j=0;j<3;j++){
    const mt=new THREE.MeshBasicMaterial({color:OR}),l=new THREE.Mesh(new THREE.BoxGeometry(.07,.07,.02),mt);
    l.position.set(-.5+j*.18,y,.51);rack.add(l);leds.push({mt,ph:Math.random()*9+k});
  }
}
rack.position.copy(P(T0-.6)).multiplyScalar(1.1);rack.rotation.y=Math.atan2(-rack.position.x,-rack.position.z);
add(rack,false);

/* Écran d’ordinateur éteint, à l’arrivée */
const sc=document.createElement('canvas');sc.width=512;sc.height=300;
const cx=sc.getContext('2d');cx.fillStyle='#030304';cx.fillRect(0,0,512,300);
const gr=cx.createLinearGradient(0,0,512,300);
gr.addColorStop(0,'rgba(255,255,255,0)');gr.addColorStop(.35,'rgba(255,140,80,.10)');
gr.addColorStop(.5,'rgba(255,255,255,.04)');gr.addColorStop(1,'rgba(255,255,255,0)');
cx.fillStyle=gr;cx.fillRect(0,0,512,300);
const stex=new THREE.CanvasTexture(sc);stex.encoding=THREE.sRGBEncoding;

const the=T0+(N-1)*D;
const mon=new THREE.Group();
const te=new V(-Math.sin(the),0,Math.cos(the));
mon.position.copy(P(the)).addScaledVector(te,2.6);
mon.rotation.y=Math.atan2(Math.sin(the),-Math.cos(the));
mon.add(box(2.2,.08,1.3,0,.04,0),box(.3,1,.2,0,.58,-.1),box(4,2.4,.16,0,2,0,true));
const scr=new THREE.Mesh(new THREE.PlaneGeometry(3.8,2.2),new THREE.MeshBasicMaterial({map:stex}));
scr.position.set(0,2,.085);mon.add(scr);
const ledM=new THREE.MeshBasicMaterial({color:OR});
const led=new THREE.Mesh(new THREE.BoxGeometry(.08,.05,.02),ledM);led.position.set(1.7,.85,.085);mon.add(led);
const tower=box(.9,2,1.6,-3.3,1,-.2,true);const strip=new THREE.Mesh(new THREE.BoxGeometry(.04,1.2,.04),new THREE.MeshBasicMaterial({color:OR}));strip.position.set(.2,0,.82);tower.add(strip);
mon.add(tower);
add(mon,false);mon.updateMatrixWorld(true);
const scrC=mon.localToWorld(new V(0,2,.09));
const nrm=new V(0,0,1).applyQuaternion(mon.quaternion);
const posF=scrC.clone().addScaledVector(nrm,6.2).add(new V(0,.2,0));
const dive=scrC.clone().addScaledVector(nrm,.05);

/* Bouton de mise en route, pressé par le dernier domino */
const B=P(the).addScaledVector(te,1.05);
const bbase=new THREE.Mesh(new THREE.CylinderGeometry(.55,.6,.1,32),dark);bbase.position.set(B.x,.05,B.z);add(bbase,false);
const ringM=new THREE.MeshBasicMaterial({color:OR});
const bring=new THREE.Mesh(new THREE.RingGeometry(.4,.48,40),ringM);bring.rotation.x=-Math.PI/2;bring.position.set(B.x,.105,B.z);add(bring,false);
const capM=new THREE.MeshStandardMaterial({color:0x1d1d21,metalness:.6,roughness:.3,emissive:OR,emissiveIntensity:0});
const cap=new THREE.Mesh(new THREE.CylinderGeometry(.3,.3,.14,32),capM);cap.position.set(B.x,.17,B.z);add(cap,true);

/* Boule + halos */
const ball=new THREE.Mesh(new THREE.SphereGeometry(.28,24,16),new THREE.MeshBasicMaterial({color:0xff7a3a}));
const tg=new V(-Math.sin(T0),0,Math.cos(T0));
const bp=P(T0).addScaledVector(tg,-.28);
add(ball,true);
const bh=new THREE.Sprite(new THREE.SpriteMaterial({map:gt,color:OR,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));
bh.scale.set(2.4,2.4,1);scene.add(bh);
const fg=new THREE.Mesh(new THREE.PlaneGeometry(4.5,4.5),halo(.8));fg.rotation.x=-Math.PI/2;scene.add(fg);

/* Caméra */
const cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const io=v=>{v=cl(v);return v<.5?4*v*v*v:1-Math.pow(-2*v+2,3)/2};
const tgt=P(T0).add(new V(0,.7,0)),endEl=document.getElementById('end');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const t0=performance.now()-(reduce?15000:0);let done=false;

function frame(){
  const t=(performance.now()-t0)/1000;

  /* chute des dominos */
  doms.forEach((d,i)=>{
    const k=cl((t-ST-i*DT)/.5);
    d.g.rotation.z=-1.32*k*k;d.mat.emissiveIntensity=.35*k;
    d.em.color.lerpColors(grey,orange,k);d.em.opacity=.4+.6*k;
  });
  dots.forEach(d=>d.mt.color.lerpColors(new THREE.Color(0x2a2a30),orange,cl((t-ST-d.f*DT)/.3)));

  /* boule */
  const by=11-(11-1.78)*Math.pow(cl((t-.3)/1.3),2);
  ball.position.set(bp.x,by,bp.z);ball.visible=t<1.75;
  bh.position.copy(ball.position);bh.visible=t<1.9;

  /* front de chute */
  const f=cl((t-ST)/DT,0,N-1),fp=P(T0+f*D).addScaledVector(te,1.05*io((t-5.3)/.8));
  fg.position.set(fp.x,.015,fp.z);fg.material.opacity=t>1.4?.8*(1-cl((t-6.4)/1)):0;
  pl.position.set(fp.x,t<1.6?by:1,fp.z);

  /* LED */
  leds.forEach(l=>{const on=Math.sin(t*6+l.ph)>-.2;l.mt.color.setHex(on?OR:0x331208)});
  const pk=cl((t-5.95)/.15);
  cap.position.y=.17-.05*pk;capM.emissiveIntensity=.9*pk;
  ringM.color.setRGB(1,.35,.12).multiplyScalar(.15+.85*pk);
  ledM.color.setRGB(1,.35,.12).multiplyScalar(t>6.1?.7+.3*Math.sin(t*3):.1);
  sync();

  /* orbite autour du front + plongée dans l’écran */
  tgt.lerp(fp.clone().add(new V(0,.7,0)),.1);
  const k=io(t/2.6),d=13-7.6*k,h=7-4.6*k,a=.6+.45*t;
  const pos=tgt.clone().add(new V(Math.cos(a)*d,h,Math.sin(a)*d));
  const s=io((t-6.8)/3.4),u=io((t-10.2)/2.8);
  pos.lerp(posF,s).lerp(dive,u);
  cam.position.copy(pos);
  cam.lookAt(tgt.clone().lerp(scrC,s));
  cam.fov=50-10*u;cam.updateProjectionMatrix();

  if(t>13.4&&!done){done=true;endEl.classList.add('on')}
  renderer.render(scene,cam);
  requestAnimationFrame(frame);
}
function sync(){pairs.forEach(([a,b])=>{b.position.copy(a.position);b.quaternion.copy(a.quaternion);b.visible=a.visible})}
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()});
frame();
})();
</script>
</body>
</html>
